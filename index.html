<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Kiopen · 个人主页</title>
<style>
  :root {
    --accent-1: #7c5cff;
    --accent-2: #22d3ee;
    --accent-3: #ff6ec7;
    --text: #f6f8ff;
    --muted: rgba(246, 248, 255, 0.72);
    --radius: 28px;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }

  body {
    position: relative;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 44px 18px;
    background: #060912;
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ===== 极光渐变背景 ===== */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: radial-gradient(120% 120% at 50% 0%, #101a3a 0%, #070b18 55%, #04060f 100%);
  }
  .aurora .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.6;
    mix-blend-mode: screen;
    will-change: transform;
  }
  .b1 {
    width: 48vmax; height: 48vmax; left: -12vmax; top: -16vmax;
    background: radial-gradient(circle at 50% 50%, #7c5cff, transparent 65%);
    animation: drift1 20s ease-in-out infinite alternate;
  }
  .b2 {
    width: 44vmax; height: 44vmax; right: -14vmax; top: 4vmax;
    background: radial-gradient(circle at 50% 50%, #22d3ee, transparent 65%);
    animation: drift2 24s ease-in-out infinite alternate;
  }
  .b3 {
    width: 42vmax; height: 42vmax; left: 22vmax; bottom: -18vmax;
    background: radial-gradient(circle at 50% 50%, #ff6ec7, transparent 65%);
    animation: drift3 28s ease-in-out infinite alternate;
  }
  .aurora::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(60% 65% at 50% 45%, transparent 0%, rgba(4, 6, 15, 0.45) 70%, rgba(4, 6, 15, 0.72) 100%);
  }
  @keyframes drift1 { to { transform: translate3d(12vmax, 10vmax, 0) scale(1.18); } }
  @keyframes drift2 { to { transform: translate3d(-10vmax, 12vmax, 0) scale(1.12); } }
  @keyframes drift3 { to { transform: translate3d(8vmax, -10vmax, 0) scale(1.2); } }

  #particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  /* ===== 卡片入场 ===== */
  .card-wrap {
    position: relative;
    z-index: 2;
    width: min(540px, 94vw);
    perspective: 1100px;
    animation: cardIn 1s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(26px) scale(0.972); }
    to { opacity: 1; transform: none; }
  }

  /* ===== 毛玻璃卡片 ===== */
  .card {
    position: relative;
    padding: 44px 42px 30px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    background:
      linear-gradient(160deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05)) padding-box,
      linear-gradient(140deg, rgba(124, 92, 255, 0.75), rgba(34, 211, 238, 0.35) 45%, rgba(255, 110, 199, 0.65)) border-box;
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    backdrop-filter: blur(22px) saturate(150%);
    box-shadow:
      0 34px 80px -24px rgba(3, 5, 16, 0.85),
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    transform-style: preserve-3d;
    transition: transform 0.18s ease-out;
    overflow: hidden;
  }
  .card-glow {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(340px 240px at var(--mx, 50%) var(--my, 0%), rgba(124, 92, 255, 0.3), transparent 70%);
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .card:hover .card-glow { opacity: 1; }

  /* ===== 头像 + 身份 ===== */
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .avatar { position: relative; width: 106px; height: 106px; margin-bottom: 22px; isolation: isolate; }
  .avatar-halo {
    position: absolute; inset: -16px; z-index: 0; border-radius: 50%;
    background: radial-gradient(circle, rgba(124, 92, 255, 0.5), rgba(34, 211, 238, 0.15) 55%, transparent 72%);
    filter: blur(14px);
    animation: breathe 4.5s ease-in-out infinite;
  }
  .avatar-ring {
    position: absolute; inset: -5px; z-index: 1; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-1));
    filter: blur(3px);
    animation: spin 9s linear infinite;
  }
  .avatar-core {
    position: absolute; inset: 4px; z-index: 2; border-radius: 50%;
    overflow: hidden;
    display: grid; place-items: center;
    background: linear-gradient(160deg, #1a2340, #0b1122);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
  }
  .avatar-core svg { width: 46px; height: 46px; color: rgba(255, 255, 255, 0.82); }
  .avatar-core img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
  .avatar-status {
    position: absolute; right: 6px; bottom: 6px; z-index: 3;
    width: 16px; height: 16px; border-radius: 50%;
    background: #34d399;
    border: 3px solid #0b1122;
    box-shadow: 0 0 10px rgba(52, 211, 153, 0.9);
    animation: pulse 2.6s ease-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.08); } }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6); }
    70% { box-shadow: 0 0 0 9px rgba(52, 211, 153, 0); }
    100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.5);
    margin-bottom: 6px;
  }
  .name {
    margin-bottom: 10px;
    font-size: 33px;
    line-height: 1.2;
    font-weight: 800;
    letter-spacing: 0.5px;
    background: linear-gradient(115deg, #ffffff, #c7d2fe 42%, #a5f3fc 78%, #ffffff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .typing { display: flex; align-items: center; gap: 2px; min-height: 24px; font-size: 15px; color: var(--muted); }
  .caret {
    display: inline-block;
    width: 2px; height: 16px;
    border-radius: 2px;
    background: var(--accent-2);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== 关于我 ===== */
  .about {
    margin-top: 24px;
    text-align: center;
    font-size: 14.5px;
    line-height: 1.9;
    color: var(--muted);
  }
  .about strong { color: #fff; font-weight: 600; }

  /* ===== 技术标签 ===== */
  .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-top: 22px; }
  .tags span {
    padding: 7px 15px;
    border-radius: 999px;
    font-size: 12.5px;
    letter-spacing: 0.3px;
    color: rgba(255, 255, 255, 0.9);
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.14);
    transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease;
  }
  .tags span:hover {
    transform: translateY(-2px);
    background: rgba(124, 92, 255, 0.3);
    border-color: rgba(124, 92, 255, 0.6);
  }

  /* ===== 分割线 + 数据统计 ===== */
  .divider {
    height: 1px;
    margin: 28px 0 22px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .stat { position: relative; padding: 2px 0; }
  .stat + .stat::before {
    content: "";
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-50%);
    height: 36px; width: 1px;
    background: linear-gradient(transparent, rgba(255, 255, 255, 0.22), transparent);
  }
  .stat b {
    display: block;
    font-size: 25px;
    line-height: 1.2;
    font-weight: 800;
    background: linear-gradient(120deg, #a5b4fc, #67e8f9);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .stat small { display: block; margin-top: 3px; font-size: 11.5px; letter-spacing: 0.6px; color: rgba(255, 255, 255, 0.5); }

  /* ===== 联系方式 ===== */
  .contact { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 26px; }
  .contact a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.9);
    text-decoration: none;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
  }
  .contact a svg { width: 16px; height: 16px; }
  .contact a:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, 0.16);
    border-color: rgba(255, 255, 255, 0.4);
    box-shadow: 0 14px 26px -14px rgba(0, 0, 0, 0.8);
    color: #fff;
  }

  .foot { margin-top: 26px; text-align: center; font-size: 11.5px; letter-spacing: 0.6px; color: rgba(255, 255, 255, 0.38); }

  /* ===== 逐段入场 ===== */
  .reveal {
    opacity: 0;
    transform: translateY(16px);
    animation: rise 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* ===== 窄屏安全适配 ===== */
  @media (max-width: 520px) {
    .card { padding: 36px 24px 26px; border-radius: 24px; }
    .name { font-size: 27px; }
  }

  /* ===== 尊重系统减少动效 ===== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .reveal { opacity: 1; transform: none; }
    .card-wrap { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <!-- 极光背景 -->
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <!-- 粒子背景 -->
  <canvas id="particles" aria-hidden="true"></canvas>

  <div class="card-wrap">
    <main class="card" id="card">
      <div class="card-glow" aria-hidden="true"></div>

      <!-- 头像 + 身份 -->
      <header class="hero reveal" style="animation-delay: 0.15s">
        <div class="avatar">
          <span class="avatar-halo" aria-hidden="true"></span>
          <span class="avatar-ring" aria-hidden="true"></span>
          <div class="avatar-core">
            <!-- 想换成真人照片：把下面这张 img 的 src 改成你的头像地址即可 -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path>
            </svg>
            <img
              src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=friendly%20developer%20avatar%2C%20flat%20vector%20illustration%2C%20person%20with%20glasses%2C%20soft%20purple%20and%20cyan%20gradient%20background%2C%20modern%20minimal%20style%2C%20centered%20portrait&image_size=square"
              alt="头像"
              loading="lazy"
              onerror="this.style.display='none'" />
          </div>
          <span class="avatar-status" aria-hidden="true"></span>
        </div>
        <p class="eyebrow">Hello, I'm</p>
        <h1 class="name">Kiopen</h1>
        <p class="typing"><span id="type">Rust / Linux 学习者</span><span class="caret" aria-hidden="true"></span></p>
      </header>

      <!-- 关于我 -->
      <section class="about reveal" style="animation-delay: 0.3s">
        <strong>Rust / Linux 学习者</strong>，正在探索 Wayland 桌面生态与系统级开发，喜欢从实际问题出发写点小工具。目前在捣鼓 Pop!_OS 护眼叠加层 eyecare-overlay，也常用 Python / SQL / R 处理数据。
      </section>

      <!-- 技术标签 -->
      <div class="tags reveal" style="animation-delay: 0.4s">
        <span>Rust</span>
        <span>Python</span>
        <span>SQL</span>
        <span>R</span>
      </div>

      <div class="divider reveal" style="animation-delay: 0.48s"></div>

      <!-- 数据统计 -->
      <section class="stats reveal" style="animation-delay: 0.55s" aria-label="数据统计">
        <div class="stat"><b>1</b><small>仓库</small></div>
        <div class="stat"><b>1</b><small>近一年贡献</small></div>
        <div class="stat"><b>1</b><small>关注中</small></div>
      </section>

      <!-- 联系方式 -->
      <nav class="contact reveal" style="animation-delay: 0.66s" aria-label="联系方式">
        <a href="https://gitee.com/kiopen" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m8 6-5 6 5 6M16 6l5 6-5 6"></path>
          </svg>
          Gitee
        </a>
        <a href="https://github.com/Pozest404" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2c-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.69 5.41-5.25 5.69.41.35.78 1.05.78 2.12v3.14c0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"></path>
          </svg>
          GitHub
        </a>
        <a href="mailto:zpozest@163.com" title="zpozest@163.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2.5"></rect>
            <path d="m3.5 7 8.5 6 8.5-6"></path>
          </svg>
          邮箱
        </a>
      </nav>

      <p class="foot reveal" style="animation-delay: 0.76s">© 2026 Kiopen · Designed with ♥</p>
    </main>
  </div>

  <script>
    /* ===== 打字机身份文案 ===== */
    (function () {
      var el = document.getElementById('type');
      if (!el) return;
      var phrases = ['Rust / Linux 学习者', '探索 Wayland 桌面生态', 'Python · SQL · R', '把想法写成小工具'];
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        el.textContent = phrases[0];
        return;
      }
      var pi = 0, ci = 0, deleting = false;
      el.textContent = '';
      function tick() {
        var word = phrases[pi];
        if (!deleting) {
          ci++;
          el.textContent = word.slice(0, ci);
          if (ci === word.length) {
            deleting = true;
            setTimeout(tick, 1600);
            return;
          }
          setTimeout(tick, 90 + Math.random() * 60);
        } else {
          ci--;
          el.textContent = word.slice(0, ci);
          if (ci === 0) {
            deleting = false;
            pi = (pi + 1) % phrases.length;
            setTimeout(tick, 300);
            return;
          }
          setTimeout(tick, 45);
        }
      }
      tick();
    })();

    /* ===== 背景粒子 ===== */
    (function () {
      var canvas = document.getElementById('particles');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var W = 0, H = 0, parts = [];

      function init() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var n = Math.min(80, Math.max(28, Math.round(W * H / 26000)));
        parts = [];
        for (var i = 0; i < n; i++) {
          parts.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 1.6 + 0.5,
            vx: (Math.random() - 0.5) * 0.22,
            vy: (Math.random() - 0.5) * 0.22,
            a: Math.random() * 0.45 + 0.15,
            hue: Math.random() > 0.5 ? 255 : 190
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          if (!reduce) {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < -10) p.x = W + 10;
            if (p.x > W + 10) p.x = -10;
            if (p.y < -10) p.y = H + 10;
            if (p.y > H + 10) p.y = -10;
          }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'hsla(' + p.hue + ',95%,78%,' + p.a + ')';
          ctx.fill();

          for (var j = i + 1; j < parts.length; j++) {
            var q = parts[j];
            var dx = p.x - q.x;
            var dy = p.y - q.y;
            var d2 = dx * dx + dy * dy;
            if (d2 < 16900) { /* 130px */
              var d = Math.sqrt(d2);
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(q.x, q.y);
              ctx.strokeStyle = 'hsla(220,90%,80%,' + (1 - d / 130) * 0.12 + ')';
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }
        }
        if (!reduce) requestAnimationFrame(draw);
      }

      init();
      draw();
      window.addEventListener('resize', function () {
        init();
        if (reduce) draw();
      });
    })();

    /* ===== 卡片 3D 悬浮 + 光标光晕 ===== */
    (function () {
      var card = document.getElementById('card');
      if (!card) return;
      if (window.matchMedia('(pointer: coarse)').matches) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var max = 6;
      card.addEventListener('pointermove', function (e) {
        var r = card.getBoundingClientRect();
        var px = (e.clientX - r.left) / r.width;
        var py = (e.clientY - r.top) / r.height;
        card.style.setProperty('--mx', (px * 100).toFixed(2) + '%');
        card.style.setProperty('--my', (py * 100).toFixed(2) + '%');
        var ry = (px - 0.5) * max * 2;
        var rx = (0.5 - py) * max * 2;
        card.style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
      });

      card.addEventListener('pointerleave', function () {
        card.style.transform = 'rotateX(0) rotateY(0)';
        card.style.setProperty('--mx', '50%');
        card.style.setProperty('--my', '0%');
      });
    })();
  </script>
</body>
</html>
