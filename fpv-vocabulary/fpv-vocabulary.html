  适用场景：Flow State / Liftoff / Velocidrone 模拟器 · Betaflight 调参 · 硬件与飞行术语
</footer>

<script>
const DATA = [
  { cat: "模拟器界面", items: [
    ["Game Controller","游戏手柄","进入时选这个用手柄"],
    ["Joystick / RC Radio","摇杆 / 遥控器","Pocket 到货后选这个"],
    ["Calibrate","校准","首次连手柄/遥控必做"],
    ["Reset","重置","撞机后重生，绑 A 键/侧键"],
    ["Pause","暂停","—"],
    ["Track / Map","赛道 / 地图","选练习场地"],
    ["Free Flight","自由飞行","无赛道随便飞"],
    ["Race","竞速模式","带计时"],
    ["Camera","摄像头","调视角"],
    ["Camera Angle","摄像头倾角","你设 15°～20° 的地方"],
    ["FPV Camera","第一视角","穿越机主视角"],
    ["Chase / Follow Cam","跟随视角","第三人称"],
    ["Field of View (FOV)","视野角度","画面广角大小"],
    ["Graphics / Quality","画质","低配电脑调低保流畅"],
    ["Frames Per Second (FPS)","帧率","流畅度，太低会晕"],
    ["Input","输入设置","改键位的地方"],
    ["Sensitivity","灵敏度","即 Rates"],
    ["Deadzone","死区","摇杆回中附近不响应的区域"],
  ]},
  { cat: "飞行模式（最重要）", items: [
    ["Angle / Stabilize","自稳模式","松手自动回正，新手起步"],
    ["Horizon","地平模式","小杆自稳、大杆翻转，过渡用"],
    ["Acro / Manual / Rate","手动模式","真穿越机手感，最终目标"],
    ["Headless","无头模式","不看机头方向，休闲用"],
    ["Auto-level","自动水平","同自稳"],
  ]},
  { cat: "摇杆与控制（四通道）", items: [
    ["Throttle (THR)","油门","左摇杆上下 = 升降"],
    ["Yaw","偏航","左摇杆左右 = 左右转向"],
    ["Pitch","俯仰","右摇杆上下 = 前俯/后仰"],
    ["Roll","横滚","右摇杆左右 = 左右侧倾"],
    ["Stick","摇杆","—"],
    ["Center","回中","摇杆居中"],
    ["Throw / Travel","行程","摇杆可移动范围"],
    ["Rudder","方向舵","= Yaw"],
    ["Elevator","升降舵","= Pitch"],
    ["Aileron","副翼","= Roll"],
    ["Mode 1 / Mode 2","手型 1 / 手型 2","Mode 2 = 油门在左，你用这个"],
  ]},
  { cat: "Betaflight 调参（真机用）", items: [
    ["Betaflight Configurator","BF 调参软件","—"],
    ["Firmware","固件","飞控里的系统"],
    ["Flash Firmware","刷固件","—"],
    ["Ports","端口设置","接图传/接收机"],
    ["Receiver","接收机","选 ELRS 2.4G"],
    ["Bind","对频 / 绑定","遥控和接收机配对"],
    ["Configuration","系统配置","机型、电池等"],
    ["Quad X","四轴 X 型","你这台的机型"],
    ["PID Tuning","PID 调节","调稳定性，新手别动"],
    ["Rates","手感速率","Roll/Pitch/Yaw 灵敏度"],
    ["Expo","指数曲线","让小杆更柔和"],
    ["Failsafe","失控保护","失联后自动降落，必设"],
    ["Battery","电池","电压报警在这设"],
    ["Voltage","电压","单片设 3.5～3.6V 报警"],
    ["Motors","电机测试","不装桨点这个测转向"],
    ["Direction","转向","电机正反"],
    ["Calibrate Accelerometer","校准加速度计","放平飞机点一下"],
    ["VTX","图传","画面发射"],
    ["OSD","屏幕叠加显示","电压、计时等信息"],
    ["ARM","解锁","打杆启动电机"],
    ["Disarm","上锁","停转"],
    ["Auxiliary / Modes","辅助开关","绑定飞行模式切换"],
  ]},
  { cat: "硬件与飞行术语", items: [
    ["Frame","机架","—"],
    ["Motor","电机","—"],
    ["ESC","电调","Electronic Speed Controller"],
    ["Flight Controller (FC)","飞控","—"],
    ["AIO","一体板","你买的 X12，All In One"],
    ["Propeller / Prop","螺旋桨","—"],
    ["LiPo Battery","锂电池","—"],
    ["mAh","毫安时","电池容量单位"],
    ["S (1S/2S/4S)","电芯数","串联电芯数量"],
    ["KV","电机转速常数","电压每升 1V 转速增量"],
    ["XT30 / XT60","电池接头型号","—"],
    ["VTX Antenna","图传天线","—"],
    ["Receiver (RX)","接收机","—"],
    ["Transmitter (TX)","遥控器（发射机）","—"],
    ["ELRS (ExpressLRS)","你的遥控协议","2.4G 版本"],
    ["Drone / Quadcopter","无人机 / 四轴","—"],
    ["Whoop","圈圈机","带桨保护圈的小机"],
    ["Freestyle","花式飞","—"],
    ["Racing","竞速","—"],
    ["Crash","炸机 / 撞机","—"],
    ["Rebind","重新对频","—"],
    ["Telemetry","遥测","数据回传"],
    ["Antenna","天线","—"],
    ["Gimbal","云台","（穿越机一般无）"],
  ]},
];

const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty');
const searchEl = document.getElementById('search');
const totalCount = document.getElementById('totalCount');
const matchCount = document.getElementById('matchCount');
const catPills = document.getElementById('catPills');

let total = 0;
DATA.forEach(c => total += c.items.length);
totalCount.textContent = total;

// build category pills
const allCats = DATA.map(c => c.cat);
allCats.forEach(cat => {
  const p = document.createElement('span');
  p.className = 'pill';
  p.textContent = cat;
  p.onclick = () => { searchEl.value = cat; render(); };
  catPills.appendChild(p);
});

function highlight(text, q) {
  if (!q) return text;
  const idx = text.toLowerCase().indexOf(q);
  if (idx === -1) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + q.length) + '</mark>' + text.slice(idx + q.length);
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  listEl.innerHTML = '';
  let matches = 0;
  let anyVisible = false;

  DATA.forEach(cat => {
    const filtered = cat.items.filter(row =>
      row[0].toLowerCase().includes(q) ||
      row[1].toLowerCase().includes(q) ||
      (row[2] || '').toLowerCase().includes(q) ||
      cat.cat.toLowerCase().includes(q)
    );
    matches += filtered.length;
    if (filtered.length === 0) return;
    anyVisible = true;

    const sec = document.createElement('section');
    const det = document.createElement('details');
    det.open = true;
    const sum = document.createElement('summary');
    const tt = document.createElement('span');
    tt.className = 'cat-title';
    tt.innerHTML = cat.cat + '<span class="cat-count">' + filtered.length + '</span>';
    sum.appendChild(tt);
    det.appendChild(sum);

    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const table = document.createElement('table');
    table.innerHTML = '<thead><tr><th>英文</th><th>中文</th><th>说明</th></tr></thead>';
    const tb = document.createElement('tbody');
    filtered.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="en">' + highlight(row[0], q) + '</td>' +
        '<td class="zh">' + highlight(row[1], q) + '</td>' +
        '<td class="note">' + highlight(row[2] || '—', q) + '</td>';
      tb.appendChild(tr);
    });
    table.appendChild(tb);
    wrap.appendChild(table);
    det.appendChild(wrap);
    sec.appendChild(det);
    listEl.appendChild(sec);
  });

  matchCount.textContent = matches;
  emptyEl.style.display = anyVisible ? 'none' : 'block';
}

searchEl.addEventListener('input', render);
render();
</script>

</body>
