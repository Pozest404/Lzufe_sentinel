[package]
name = "lancai-sentinel"
version = "3.4.0"
edition = "2021"
description = "澜彩哨兵核心：手动文本分析、规则抽取、本地存储、AI 总结与推送（Rust）"

[lib]
name = "lancai_sentinel"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "lancai"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json", "tls"] }
anyhow = "1"
thiserror = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
