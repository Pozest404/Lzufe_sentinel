[package]
name = "keep-run-app"
version = "0.1.0"
description = "Keep 运动轨迹模拟器 · Rust 桌面应用"
authors = ["you"]
edition = "2021"

[lib]
name = "keep_run_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
anyhow = "1"
thiserror = "1"
directories = "5"
rand = "0.9"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
